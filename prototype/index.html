<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#17251b">
  <title>DINO GAME — Action RPG Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <canvas id="world" aria-label="Игровое поле"></canvas>
    <header class="hud">
      <div class="vitals">
        <div class="health"><span id="healthFill"></span></div>
        <div class="xp"><span id="xpFill"></span></div>
        <div class="hud-line"><b id="level">УРОВЕНЬ 1</b><span id="hpText">100 / 100</span></div>
      </div>
      <div class="objective"><span>ДРЕВНИЕ ДЖУНГЛИ</span><b id="wave">ВОЛНА 1</b></div>
    </header>
    <div class="hint" id="hint">Уничтожай хищников и собирай опыт</div>
    <div class="controls">
      <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
      <div class="actions">
        <button id="special" class="action special" aria-label="Особая атака"><span>✦</span><small>ИМПУЛЬС</small></button>
        <button id="dash" class="action dash" aria-label="Рывок"><span>➤</span><small>РЫВОК</small></button>
      </div>
    </div>
    <div id="levelUp" class="overlay hidden">
      <section class="dialog">
        <p class="eyebrow">ЭВОЛЮЦИОННЫЙ ВЫБОР</p>
        <h1>Новый уровень!</h1>
        <p>Выбери улучшение для своего динозавра</p>
        <div id="choices" class="choices"></div>
      </section>
    </div>
    <div id="pause" class="overlay hidden">
      <section class="dialog">
        <p class="eyebrow">DINO GAME · ПРОТОТИП</p>
        <h1>Пауза</h1>
        <button id="resume" class="choice">Продолжить</button>
        <button id="restart" class="choice secondary">Начать заново</button>
      </section>
    </div>
    <button id="pauseBtn" class="pause-btn" aria-label="Пауза">Ⅱ</button>
    <div class="footer-note">ПРОТОТИП · 0.0.1</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
